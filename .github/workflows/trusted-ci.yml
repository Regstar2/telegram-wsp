name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run project checks
        shell: pwsh
        run: ./scripts/ci.ps1

  integration:
    name: Overlay and APK (${{ matrix.telegram }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        telegram: [pinned, telegram-13-0-3, telegram-13-2-2]

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Select Telegram 13.0.3 regression fixture
        if: matrix.telegram == 'telegram-13-0-3'
        shell: pwsh
        run: |
          $upstream = Get-Content config/upstream.json -Raw | ConvertFrom-Json
          $upstream.pinnedCommit = '0aae959806c57be8ad457980f2a5c6277ff18635'
          $upstream.telegramVersion = '13.0.3'
          $upstream.telegramBuild = 7183
          $upstream | ConvertTo-Json -Depth 4 | Set-Content config/upstream.json

      - name: Select Telegram 13.2.2 candidate fixture
        if: matrix.telegram == 'telegram-13-2-2'
        shell: pwsh
        run: |
          $upstream = Get-Content config/upstream.json -Raw | ConvertFrom-Json
          $upstream.pinnedCommit = '21f7d109da6ab3506c9e9577f98c6a38771ab335'
          $upstream.telegramVersion = '13.2.2'
          $upstream.telegramBuild = 7303
          $upstream | ConvertTo-Json -Depth 4 | Set-Content config/upstream.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        shell: bash
        run: sdkmanager "platforms;android-35" "platforms;android-36" "ndk;27.2.12479018"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Reproduce integration
        shell: pwsh
        run: ./scripts/prepare-integration.ps1 -Force

      - name: Re-run repository checks on prepared tree
        shell: pwsh
        run: ./scripts/ci.ps1

      - name: Reject incompatible SDK anchor
        shell: pwsh
        run: |
          $path = '.work/telegram/TMessagesProj/build.gradle'
          $original = Get-Content $path -Raw
          $pattern = '(?m)^        minSdkVersion (21|23)$'
          $modified = [regex]::Replace($original, $pattern, '        minSdkVersion 42')
          if ($modified -eq $original) { throw 'Test fixture could not change minSdk.' }
          try {
            Set-Content $path $modified -NoNewline
            $rejected = $false
            try {
              ./scripts/apply-integration.ps1
            } catch {
              if ($_.Exception.Message -notmatch 'minSdk/targetSdk contract is unsupported') {
                throw "Unexpected rejection: $($_.Exception.Message)"
              }
              $rejected = $true
            }
            if (-not $rejected) { throw 'Unsupported API 42 integration was accepted.' }
          } finally {
            Set-Content $path $original -NoNewline
          }

      - name: Compile Telegram-WSP prototype APK
        shell: pwsh
        env:
          # Public Telegram upstream fallback values; compile-only CI, no release signing.
          TELEGRAM_API_ID: '4'
          TELEGRAM_API_HASH: '014b35b6184100b085b0d0572f9b5103'
        run: ./scripts/build-apk.ps1 -SkipPrepare

      - name: Verify Telegram 13.2.2 Corresponding Source
        if: matrix.telegram == 'telegram-13-2-2'
        shell: pwsh
        run: |
          ./scripts/package-release-source.ps1 -OutputDirectory 'dist/ci-source'
          $manifest = Get-Content 'dist/ci-source/SOURCE_MANIFEST.json' -Raw | ConvertFrom-Json
          $expectedPath = 'TMessagesProj/jni/twidget/widget-sandbox/packages/ios/Sources/CQuickJS/quickjs'
          $entries = @($manifest.telegramSubmodules | Where-Object { $_.path -eq $expectedPath })
          if ($entries.Count -ne 1) { throw 'QuickJS is missing or duplicated in SOURCE_MANIFEST.json.' }
          $archive = Join-Path 'dist/ci-source' $entries[0].archive
          if (-not (Test-Path $archive)) { throw "QuickJS archive not found: $archive" }
          Add-Type -AssemblyName System.IO.Compression
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $archive).Path)
          try {
            if (-not @($zip.Entries | Where-Object { $_.FullName -eq 'quickjs.c' }).Count) {
              throw 'Nested QuickJS source archive does not contain quickjs.c.'
            }
          } finally {
            $zip.Dispose()
          }
